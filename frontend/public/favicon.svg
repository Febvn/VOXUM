<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Rounded Dark Frame -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#27272a" stroke-width="1.5"/>

  <!-- Synergized V + O + X Monogram -->
  <!-- Upper "X" Arms -->
  <path d="M20 18 L32 32 L44 18" stroke="#71717a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "O" Acoustic Orbit Ring -->
  <circle cx="32" cy="32" r="11" stroke="#ffffff" stroke-width="3.5"/>
  <!-- Central Sound Energy Core -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>

  <!-- Dominant "V" Crest (Completing the lower X geometry) -->
  <path d="M14 26 L32 50 L50 26" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric Accent Nodes -->
  <circle cx="14" cy="26" r="2" fill="#a1a1aa"/>
  <circle cx="50" cy="26" r="2" fill="#a1a1aa"/>
  <circle cx="32" cy="50" r="2.5" fill="#ffffff"/>
</svg>